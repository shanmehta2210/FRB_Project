sextractor:
  # detect_thresh: 3 (was 10).  Phase 1 produces both image.cat AND the
  # segmentation map that Phase 3a (GALFIT cutout) uses to identify and mask
  # the host galaxy.  At thresh=10 faint hosts (mag ~21-22) were silently
  # missing from the segmap, so Phase 3a was picking the nearest *other*
  # source 30-50" away as the "host" — the GALFIT fit then ran on the wrong
  # galaxy.  PSFEx is unaffected by this change: it has its own SAMPLE_MINSN
  # filter (30 by default below) that keeps the PSF model built only from
  # high-SNR clean stars.
  detect_thresh: 3
  analysis_thresh: 3
  # SExtractor + DES default; was hard-coded 1e-4 (much more aggressive splitting).
  deblend_mincont: 0.005
  # Photometric aperture ladder (diameters, px). The full list goes straight
  # into SExtractor's PHOT_APERTURES; MAG_APER then has one column per entry.
  phot_apertures_px: [4.0, 5.0, 6.0, 7.0, 8.0, 9.0, 10.0, 11.0, 12.0, 13.0, 15.0, 20.0, 25.0, 30.0, 40.0]
  # Aperture used for the zero point + production magnitude. null -> largest
  # aperture in the list above (the historical 40 px behaviour). Set to any
  # value in the list (e.g. 30.0) to calibrate on a different aperture.
  production_aperture_px: null
  gain: 1.6
  mag_zeropoint: 0.0
  # pixel_scale is now derived from the FITS WCS header automatically.
  # Do NOT set it here — master_run.py and phase scripts compute it per-image.
  seeing_fwhm: 2.0
  # use_weight_map: true is the default; the phase script automatically falls
  # back to NONE if invvar.fits is absent. master_run.py also writes this
  # explicitly based on whether --invvar was provided.
  use_weight_map: true

psfex:
  psf_sampling: 1.0
  psfvar_degrees: 0
  sample_fwhm_range: "2.0,10"
  sample_variability: 0.4
  sample_minsn: 30
  sample_max_ellp: 0.2
  # Stop the SAMPLE_MINSN retry ladder (30,20,10,5,3,2.5,2) once PSFEx accepts
  # at least this many stars for the PSF model.
  min_accepted_stars: 25
